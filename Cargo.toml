[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# internal
rgateway-core = { path = "crates/rgateway-core" }
rgateway-config = { path = "crates/rgateway-config" }
rgateway-router = { path = "crates/rgateway-router" }
rgateway-filters = { path = "crates/rgateway-filters" }
rgateway-proxy = { path = "crates/rgateway-proxy" }
rgateway-obs = { path = "crates/rgateway-obs" }
rgateway-mgmt = { path = "crates/rgateway-mgmt" }

# async runtime / io
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "io-util"] }
tokio-util = { version = "0.7", features = ["rt", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = { version = "0.3", features = ["std", "sink"] }
bytes = "1"

# http core
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "compression-full"] }

# gRPC
tonic = "0.13"
prost = "0.13"
prost-types = "0.13"
prost-reflect = { version = "0.14", features = ["serde"] }
tonic-build = "0.13"
prost-build = "0.13"

# config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
notify = "8"
arc-swap = "1"
dashmap = "6"
regex = "1"

# governance / security
governor = "0.8"
jsonwebtoken = "9"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pemfile = "2"
ipnet = { version = "2", features = ["serde"] }
base64 = "0.22"

# observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }

# misc
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v7"] }
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
